{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h1>Checkout</h1>
<table>
    <tr><th>Product</th><th>Price (₹)</th><th>Qty</th><th>Total (₹)</th></tr>
    {% for i in items %}
    <tr>
        <td>{{ i.name }}</td><td>{{ i.price }}</td>
        <td>{{ i.quantity }}</td><td>{{ i.line_total }}</td>
    </tr>
    {% endfor %}
    <tr><th colspan="3" style="text-align:right">Grand Total</th><th>₹ {{ total }}</th></tr>
</table>
<h3>Delivery details</h3>
<form method="POST">
    <textarea name="address" placeholder="Full delivery address" required></textarea>
    <select name="payment_method">
        <option value="COD">Cash on Delivery</option>
        <option value="ONLINE">Online Payment</option>
    </select>
    <button type="submit">Place Order</button>
    <a href="/cart">Back to cart</a>
</form>
{% endblock %}

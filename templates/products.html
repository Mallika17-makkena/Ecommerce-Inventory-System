<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        .low { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Our Products</h1>
    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Price (₹)</th><th>Stock</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td class="{{ 'low' if p.stock_quantity <= p.low_stock_threshold }}">
                {{ p.stock_quantity }}
                {% if p.stock_quantity <= p.low_stock_threshold %}(Low stock){% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

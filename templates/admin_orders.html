{% extends "base.html" %}
{% block title %}Manage Orders{% endblock %}
{% block content %}
<h1>Manage Orders</h1>
<table>
    <tr><th>Order</th><th>Customer</th><th>Total (₹)</th><th>Date</th><th>Status</th></tr>
    {% for o in orders %}
    <tr>
        <td>#{{ o.id }}</td>
        <td>{{ o.full_name }}</td>
        <td>{{ o.total_amount }}</td>
        <td>{{ o.created_at }}</td>
        <td>
            <form method="POST" action="/admin/orders/{{ o.id }}/status">
                <select name="status" style="display:inline-block; width:140px;">
                    {% for s in ['pending','confirmed','shipped','delivered','cancelled'] %}
                    <option value="{{ s }}" {% if o.status == s %}selected{% endif %}>{{ s|capitalize }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Update</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
